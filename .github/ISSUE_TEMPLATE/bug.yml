name: Bug report
description: Report incorrect or unexpected skill behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: skill
    attributes:
      label: Affected skill
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or context
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Agent or harness
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
