name: Improvement idea
description: Suggest an improvement or a new skill
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Affected existing skill
      description: Leave blank if this is not about an existing skill.
  - type: textarea
    id: use_case
    attributes:
      label: Observed real-world use case
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: insufficiency
    attributes:
      label: Why existing behavior is insufficient
    validations:
      required: true
